name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master, codex/locus-zh-cn ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Run Unit Tests
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📱 Select Xcode
        run: |
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift -version

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: xcodegen generate

      - name: 🧪 Run Unit Tests on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [device for runtime in json.load(sys.stdin)["devices"].values()
                     for device in runtime if device["name"].startswith("iPhone")]
          devices.sort(key=lambda device: device["name"] != "iPhone 16")
          sys.exit("No iPhone simulator is available") if not devices else print(devices[0]["udid"])
          ')
          FFI_FIXTURE_DIR="$(mktemp -d)"
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios18.0-simulator \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I Vendor/idevice -c Tests/Fixtures/SimulatorIdevice.c -o "$FFI_FIXTURE_DIR/idevice.o"
          xcrun libtool -static -o "$FFI_FIXTURE_DIR/libidevice_ffi.a" "$FFI_FIXTURE_DIR/idevice.o"
          xcrun simctl bootstatus "$SIM_ID" -b
          set -o pipefail
          xcodebuild test \
            -project Locus.xcodeproj \
            -scheme Locus \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/LocusTests.xcresult" \
            "LIBRARY_SEARCH_PATHS=$FFI_FIXTURE_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/LocusTests.log" || {
              TEST_STATUS=$?
              TEST_FAILURES=$(grep -E 'error:|failed|Testing failed|Unable to' "$RUNNER_TEMP/LocusTests.log" | tail -12 | cut -c1-500 || true)
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  printf '::error::%s\n' "${line//%/%25}"
                fi
              done <<< "$TEST_FAILURES"
              exit "$TEST_STATUS"
            }

      - name: Summarize simulator test results
        if: always()
        run: |
          RESULT="$RUNNER_TEMP/LocusTests.xcresult"
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULT" --compact \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build-ipa:
    name: 📱 Build iOS IPA
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 📱 Select Xcode
        run: |
          for xcode in /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift -version

      - name: 📦 Verify Vendor idevice FFI library
        run: |
          if [ ! -f "Vendor/idevice/libidevice_ffi.a" ]; then
            echo "::error::Vendor/idevice/libidevice_ffi.a is missing!"
            exit 1
          fi
          ls -lh Vendor/idevice/libidevice_ffi.a

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: xcodegen generate

      - name: 🔧 Patch project.pbxproj for Unsigned Build
        run: |
          node -e "
          const fs = require('fs');
          const pbxFile = 'Locus.xcodeproj/project.pbxproj';
          if (fs.existsSync(pbxFile)) {
            let pbx = fs.readFileSync(pbxFile, 'utf8');
            pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
            pbx = pbx.replace(/ProvisioningStyle = Automatic;/g, 'ProvisioningStyle = Manual;');
            pbx = pbx.replace(/CODE_SIGNING_ALLOWED = YES;/g, 'CODE_SIGNING_ALLOWED = NO;');
            pbx = pbx.replace(/DevelopmentTeam = [^;]+;/g, 'DevelopmentTeam = \"\";');
            pbx = pbx.replace(/buildSettings = \{/g, 'buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";');
            fs.writeFileSync(pbxFile, pbx);
            console.log('✅ project.pbxproj successfully patched for manual unsigned build');
          }
          "

      - name: ⚙️ Build Archive via Xcode (Real iPhone ARM64)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Locus.xcodeproj \
            -scheme Locus \
            -archivePath "build/Locus.xcarchive" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcode_build.log || {
              echo "### ❌ Xcode Build Error Log" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 120 xcode_build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: 📦 Package into Locus-Timer-CN.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Locus.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          echo "Found .app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in archive!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r Locus-Timer-CN.ipa Payload
          cd ..
          echo "### 🎉 IPA Successfully Built" >> $GITHUB_STEP_SUMMARY
          ls -lh build/Locus-Timer-CN.ipa

      - name: 🚀 Upload Locus-Timer-CN.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locus-Timer-CN-ipa
          path: build/Locus-Timer-CN.ipa
          retention-days: 14

      - name: 🌟 Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Locus-Timer v1.0.${{ github.run_number }}"
          body: "Готовый к установке iOS IPA файл Locus с таймером и фоновым режимом, собранный через GitHub Actions без платного аккаунта Apple."
          files: build/Locus-Timer-CN.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-error-log
          path: xcode_build.log
